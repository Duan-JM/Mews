name: codeql

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: "30 3 * * 1"

jobs:
  analyze:
    runs-on: macos-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: go
      - uses: github/codeql-action/analyze@v3

