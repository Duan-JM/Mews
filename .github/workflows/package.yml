name: package

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint-tools
      - name: Run release checks
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: VERSION=v0.0.1 make release-check
      - name: Run development package checks
        if: github.ref != 'refs/heads/main' && github.base_ref != 'main'
        run: |
          VERSION=v0.0.1-dev.1 make package
          (
            cd dist
            shasum -a 256 -c "mews-v0.0.1-dev.1-darwin.tar.gz.sha256"
          )
          VERSION=v0.0.1-dev.1 ./scripts/smoke-package.sh
          VERSION=v0.0.1-dev.1 CASK_LOCAL_BUILD=1 SKIP_PACKAGE=1 ./scripts/smoke-cask.sh
