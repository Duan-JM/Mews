name: package

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: VERSION=v0.0.1 make package
      - run: cd dist && shasum -a 256 -c mews-v0.0.1-darwin.tar.gz.sha256
      - run: VERSION=v0.0.1 ./scripts/smoke-package.sh
      - run: VERSION=v0.0.1 CASK_LOCAL_BUILD=1 SKIP_PACKAGE=1 ./scripts/smoke-cask.sh
